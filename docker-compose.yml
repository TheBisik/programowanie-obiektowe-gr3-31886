version: '3.8'

services:
  # Serwis bazy danych
  db:
    image: postgres:latest
    container_name: discount_db
    restart: always
    networks:
      - app-network
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: DiscountDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./Lab1/DiscountApp/db-init:/docker-entrypoint-initdb.d

  # Serwis aplikacji .NET
  app:
    build:
      context: ./Lab1
      dockerfile: DiscountApp/Dockerfile
    container_name: discount_app
    networks:
      - app-network
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=db;Database=DiscountDb;Username=root;Password=root
    depends_on:
      - db

volumes:
  postgres_data:
    
networks:
  app-network:
    driver: bridge